<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de aprendices</title>
</head>
<body>
    <nav>
        <a href="index.html">Ejercicio 1</a>
        <a href="ejercicio2.html">Ejercicio 2</a>
    </nav>

    <h1>Registro de aprendices</h1>

    <form id="formulario">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <br><br>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <br><br>

        <label for="documento">Documento</label>
        <input type="number" id="documento" name="documento" required>

        <br><br>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" required>

        <br><br>

        <label for="fecha">Fecha de nacimiento</label>
        <input type="date" id="fecha" name="fecha" required>

        <br><br>

        <label for="programa">Programa de formación</label>
        <select id="programa" name="programa" required>
            <option value="">Seleccione</option>
            <option value="ADSO">ADSO</option>
            <option value="Multimedia">Multimedia</option>
            <option value="Redes">Redes</option>
        </select>

        <br><br>

        <span>Jornada</span>
        <input type="radio" id="diurna" name="jornada" value="Diurna" required>
        <label for="diurna">Diurna</label>
        <input type="radio" id="nocturna" name="jornada" value="Nocturna">
        <label for="nocturna">Nocturna</label>

        <br><br>

        <label>
            <input type="checkbox" name="acepta" required>
            Acepto el tratamiento de datos
        </label>

        <br><br>

        <button type="submit">Registrar</button>
    </form>

    <hr>

    <h2>Información registrada</h2>
    <div id="resultado"></div>

    <script src="js/app.js"></script>
</body>
</html>
